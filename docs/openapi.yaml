openapi: 3.0.3
info:
  title: Farewell API - Funeral Services
  description: |
    A Supabase-powered API for funeral-related services with Google Maps integration.
    
    This API provides endpoints for finding funeral-related services near a location,
    including banks, funeral homes, legal services, insurance, government services,
    and counseling support.
    
    ## Authentication
    All endpoints require authentication via Supabase JWT tokens. Include the token
    in the Authorization header as `Bearer <token>`.
    
    ## Rate Limiting
    API calls are subject to Google Maps API rate limits and Supabase Edge Function limits.
  version: 1.0.0
  contact:
    name: Farewell API Support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:54321
    description: Local development server (Supabase Auth + Edge Functions)
  - url: https://your-project-ref.supabase.co
    description: Production server (Supabase Auth + Edge Functions)

security:
  - token: []

paths:
  /auth/v1/signup:
    post:
      summary: Sign up a new user
      description: |
        Create a new user account with email and password. Returns a JWT token
        that can be used to authenticate with other API endpoints.
        
        **Note**: This endpoint requires the `apikey` header with your Supabase anon key.
      operationId: signUpUser
      tags:
        - Authentication
      parameters:
        - name: apikey
          in: header
          required: true
          schema:
            type: string
          description: Supabase anonymous key
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "user@example.com"
                password:
                  type: string
                  minLength: 6
                  description: User's password (minimum 6 characters)
                  example: "password123"
            examples:
              signup_example:
                summary: Sign up a new user
                value:
                  email: "user@example.com"
                  password: "password123"
      responses:
        '200':
          description: User successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT token for API authentication
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  token_type:
                    type: string
                    example: "bearer"
                  expires_in:
                    type: integer
                    description: Token expiration time in seconds
                    example: 3600
                  refresh_token:
                    type: string
                    description: Token for refreshing access token
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: "123e4567-e89b-12d3-a456-426614174000"
                      email:
                        type: string
                        format: email
                        example: "user@example.com"
                      created_at:
                        type: string
                        format: date-time
                        example: "2024-01-15T10:30:00.000Z"
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid email format
                  value:
                    error: "Invalid email format"
                weak_password:
                  summary: Password too weak
                  value:
                    error: "Password should be at least 6 characters"
        '422':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user_exists:
                  summary: User already exists
                  value:
                    error: "User already registered"

  /auth/v1/token:
    post:
      summary: Sign in an existing user
      description: |
        Authenticate a user with email and password. Returns a JWT token
        that can be used to authenticate with other API endpoints.
        
        **Note**: This endpoint requires the `apikey` header with your Supabase anon key.
        Use `grant_type=password` as a query parameter.
      operationId: signInUser
      tags:
        - Authentication
      parameters:
        - name: grant_type
          in: query
          required: true
          schema:
            type: string
            enum: [password]
          description: OAuth grant type
          example: "password"
        - name: apikey
          in: header
          required: true
          schema:
            type: string
          description: Supabase anonymous key
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "user@example.com"
                password:
                  type: string
                  description: User's password
                  example: "password123"
            examples:
              signin_example:
                summary: Sign in existing user
                value:
                  email: "user@example.com"
                  password: "password123"
      responses:
        '200':
          description: User successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT token for API authentication
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  token_type:
                    type: string
                    example: "bearer"
                  expires_in:
                    type: integer
                    description: Token expiration time in seconds
                    example: 3600
                  refresh_token:
                    type: string
                    description: Token for refreshing access token
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: "123e4567-e89b-12d3-a456-426614174000"
                      email:
                        type: string
                        format: email
                        example: "user@example.com"
                      last_sign_in_at:
                        type: string
                        format: date-time
                        example: "2024-01-15T10:30:00.000Z"
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Invalid credentials
                  value:
                    error: "Invalid login credentials"

  /functions/v1/task-management:
    get:
      summary: Get task instances for a case
      description: |
        Retrieve all task instances and their details for a specific case. This endpoint
        provides comprehensive task management data including task steps, completion status,
        notes, and related articles.
        
        **Case Filter**: Use the `case_id` query parameter to filter tasks for a specific case.
        **User Filter**: Admins can optionally use `user_id` to filter by specific user's cases.
      operationId: getTaskInstances
      tags:
        - Task Management
      parameters:
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the case to retrieve task instances for
          example: "123e4567-e89b-12d3-a456-426614174000"
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: UUID of user to filter cases by (admin only)
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Task instances retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskManagementResponse'
              examples:
                success_example:
                  summary: Successful task instances retrieval
                  value:
                    task_instances:
                      - id: "task-instance-1"
                        case_id: "case-1"
                        task_template_id: "template-1"
                        assigned_user_id: "user-1"
                        status: "in_progress"
                        created_at: "2024-01-15T10:30:00.000Z"
                        updated_at: "2024-01-15T11:00:00.000Z"
                        case:
                          id: "case-1"
                          deceased_name: "John Doe"
                          date_of_death: "2024-01-10"
                          user_id: "user-1"
                        task_template:
                          id: "template-1"
                          name: "Funeral Arrangements"
                          description: "Complete funeral planning tasks"
                        assigned_user:
                          id: "user-1"
                          name: "Jane Smith"
                          email: "jane@example.com"
                          role: "executor"
                        task_steps:
                          - id: "step-1"
                            title: "Contact Funeral Home"
                            order: 1
                            instructions: "Research and contact local funeral homes"
                            communication_helpers:
                              template_email: "Dear [Funeral Home], I am reaching out regarding funeral arrangements..."
                              phone_script: "Hello, I'm calling to inquire about your funeral services..."
                            completed: true
                            completed_at: "2024-01-15T10:45:00.000Z"
                        notes:
                          - id: "note-1"
                            content: "Contacted three funeral homes, waiting for quotes"
                            created_at: "2024-01-15T10:45:00.000Z"
                            author:
                              id: "user-1"
                              name: "Jane Smith"
                              email: "jane@example.com"
                        articles:
                          - id: "article-1"
                            title: "How to Choose a Funeral Home"
                            summary: "Guidelines for selecting the right funeral home"
                            content_url: "https://example.com/funeral-home-guide"
                            read_time_min: 5
                    statistics:
                      total_instances: 1
                      pending: 0
                      in_progress: 1
                      done: 0
                      total_steps: 3
                      completed_steps: 1
                    user_id: "user-1"
                    user_role: "executor"
                    case_id: "case-1"
                    filtered_by_user: null
                    timestamp: "2024-01-15T11:00:00.000Z"
        '400':
          description: Bad request - Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_case_id:
                  summary: Missing case_id parameter
                  value:
                    error: "case_id parameter is required"
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    error: "Unauthorized"
                    message: "Invalid or missing authentication token"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    error: "Internal server error"
                    details: "Failed to fetch task instances"

  /functions/v1/cases:
    get:
      summary: List accessible cases
      description: |
        Retrieve the list of cases the authenticated user can access. Admins may optionally
        filter cases by user. Results include linked collaborators and support pagination
        and simple search by deceased name.
      operationId: listCases
      tags:
        - Cases
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |
            UUID of a user to filter cases by. Only administrators may filter for users
            other than themselves.
          example: "123e4567-e89b-12d3-a456-426614174000"
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive search term applied to the deceased name.
          example: "Doe"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of cases to return.
          example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of cases to skip for pagination.
          example: 0
      responses:
        '200':
          description: Cases retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesResponse'
              examples:
                success_example:
                  summary: Successful cases retrieval
                  value:
                    cases:
                      - id: "case-1"
                        deceased_name: "John Doe"
                        date_of_death: "2024-01-10"
                        created_at: "2024-01-10T08:00:00.000Z"
                        updated_at: "2024-01-12T09:15:00.000Z"
                        case_users:
                          - user_id: "user-1"
                            profiles:
                              id: "user-1"
                              name: "Jane Smith"
                              email: "jane@example.com"
                              role: "executor"
                    total_count: 1
                    user_id: "user-1"
                    user_role: "executor"
                    filtered_by_user: "user-1"
                    timestamp: "2024-01-15T11:00:00.000Z"
        '403':
          description: Forbidden - User attempted to access another user's cases without permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden access
                  value:
                    error: "Access denied: You can only view your own cases"
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    error: "Unauthorized"
                    message: "Invalid or missing authentication token"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    error: "Internal server error"
                    details: "Failed to fetch cases"

  /functions/v1/articles:
    get:
      summary: List articles
      description: |
        Retrieve a list of articles with optional search and pagination. This endpoint
        provides access to all articles in the system, which can be used for reference
        materials related to funeral planning and related tasks.
        
        **Search**: Use the `search` parameter to filter articles by title or summary.
        **Pagination**: Use `limit` and `offset` parameters for paginated results.
      operationId: listArticles
      tags:
        - Articles
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter articles by title or summary
          example: "funeral planning"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of articles to return
          example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of articles to skip for pagination
          example: 0
      responses:
        '200':
          description: Articles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlesResponse'
              examples:
                success_example:
                  summary: Successful articles retrieval
                  value:
                    articles:
                      - id: "article-1"
                        title: "How to Choose a Funeral Home"
                        summary: "Guidelines for selecting the right funeral home for your needs"
                        content_url: "https://example.com/funeral-home-guide"
                        read_time_min: 5
                        created_at: "2024-01-01T00:00:00.000Z"
                        updated_at: "2024-01-01T00:00:00.000Z"
                      - id: "article-2"
                        title: "Understanding Funeral Costs"
                        summary: "A comprehensive guide to funeral expenses and budgeting"
                        content_url: "https://example.com/funeral-costs"
                        read_time_min: 8
                        created_at: "2024-01-02T00:00:00.000Z"
                        updated_at: "2024-01-02T00:00:00.000Z"
                    total_count: 25
                    user_id: "user-1"
                    user_role: "executor"
                    timestamp: "2024-01-15T11:00:00.000Z"
                search_example:
                  summary: Search results
                  value:
                    articles:
                      - id: "article-3"
                        title: "Funeral Planning Checklist"
                        summary: "Essential steps for planning a funeral service"
                        content_url: "https://example.com/funeral-checklist"
                        read_time_min: 6
                        created_at: "2024-01-03T00:00:00.000Z"
                        updated_at: "2024-01-03T00:00:00.000Z"
                    total_count: 1
                    user_id: "user-1"
                    user_role: "executor"
                    timestamp: "2024-01-15T11:00:00.000Z"
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    error: "Unauthorized"
                    message: "Invalid or missing authentication token"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    error: "Internal server error"
                    details: "Failed to fetch articles"

  /functions/v1/google_maps_finder:
    post:
      summary: Search for funeral-related services
      description: |
        Search for funeral-related services near a specified location using Google Maps API.
        Returns a list of businesses matching the specified category within the given radius.
      operationId: searchFuneralServices
      tags:
        - Funeral Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              banks_example:
                summary: Search for banks
                value:
                  location: "New York, NY"
                  category: "banks"
                  radius: 5000
                  limit: 20
              funeral_homes_example:
                summary: Search for funeral homes
                value:
                  location: "Los Angeles, CA"
                  category: "funeral_homes"
                  radius: 10000
                  limit: 15
      responses:
        '200':
          description: Successful search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                success_example:
                  summary: Successful search results
                  value:
                    category: "banks"
                    category_name: "Banks & Financial Services"
                    location: "New York, NY"
                    results:
                      - id: "ChIJd8BlQ2BZwokRAFUEcm_qrcA"
                        name: "Chase Bank"
                        address: "123 Main St, New York, NY 10001"
                        rating: 4.2
                        price_level: 2
                        types: ["bank", "atm", "finance"]
                        geometry:
                          location:
                            lat: 40.7128
                            lng: -74.0060
                        business_status: "OPERATIONAL"
                        category: "banks"
                        category_name: "Banks & Financial Services"
                    total_found: 15
                    user_id: "123e4567-e89b-12d3-a456-426614174000"
                    search_timestamp: "2024-01-15T10:30:00.000Z"
        '400':
          description: Bad request - Invalid input parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_location:
                  summary: Missing location parameter
                  value:
                    error: "Location and category are required"
                invalid_category:
                  summary: Invalid category
                  value:
                    error: "Invalid category"
                    available_categories: ["banks", "funeral_homes", "legal_services", "insurance", "government_services", "counseling"]
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    error: "Unauthorized"
                    message: "Invalid or missing authentication token"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                api_key_error:
                  summary: Google Maps API key not configured
                  value:
                    error: "Google Maps API key not configured"
                server_error:
                  summary: Internal server error
                  value:
                    error: "Internal server error"
                    details: "Error message details"

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase JWT token obtained through authentication.
        Include the token in the Authorization header as `Bearer <token>`.

  schemas:
    SearchRequest:
      type: object
      required:
        - location
        - category
      properties:
        location:
          type: string
          description: The location to search near (address, city, or coordinates)
          example: "New York, NY"
        category:
          type: string
          enum: [banks, funeral_homes, legal_services, insurance, government_services, counseling]
          description: The category of services to search for
          example: "banks"
        radius:
          type: integer
          minimum: 100
          maximum: 50000
          default: 5000
          description: Search radius in meters
          example: 5000
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
          description: Maximum number of results to return
          example: 20

    SearchResponse:
      type: object
      properties:
        category:
          type: string
          description: The search category used
          example: "banks"
        category_name:
          type: string
          description: Human-readable category name
          example: "Banks & Financial Services"
        location:
          type: string
          description: The search location
          example: "New York, NY"
        results:
          type: array
          items:
            $ref: '#/components/schemas/PlaceResult'
        total_found:
          type: integer
          description: Total number of results found
          example: 15
        user_id:
          type: string
          format: uuid
          description: ID of the authenticated user who made the request
          example: "123e4567-e89b-12d3-a456-426614174000"
        search_timestamp:
          type: string
          format: date-time
          description: Timestamp when the search was performed
          example: "2024-01-15T10:30:00.000Z"

    PlaceResult:
      type: object
      properties:
        id:
          type: string
          description: Google Places API place ID
          example: "ChIJd8BlQ2BZwokRAFUEcm_qrcA"
        name:
          type: string
          description: Business name
          example: "Chase Bank"
        address:
          type: string
          description: Formatted address
          example: "123 Main St, New York, NY 10001"
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          description: Business rating (0-5 stars)
          example: 4.2
        price_level:
          type: integer
          minimum: 0
          maximum: 4
          description: Price level indicator (0=Free, 4=Very Expensive)
          example: 2
        types:
          type: array
          items:
            type: string
          description: Array of place types
          example: ["bank", "atm", "finance"]
        geometry:
          type: object
          properties:
            location:
              type: object
              properties:
                lat:
                  type: number
                  format: float
                  example: 40.7128
                lng:
                  type: number
                  format: float
                  example: -74.0060
        business_status:
          type: string
          enum: [OPERATIONAL, CLOSED_TEMPORARILY, CLOSED_PERMANENTLY]
          description: Current business status
          example: "OPERATIONAL"
        category:
          type: string
          description: Search category used
          example: "banks"
        category_name:
          type: string
          description: Human-readable category name
          example: "Banks & Financial Services"
        phone_number:
          type: string
          nullable: true
          description: Formatted phone number
          example: "(555) 123-4567"
        website:
          type: string
          nullable: true
          format: uri
          description: Business website URL
          example: "https://www.example-bank.com"
        google_maps_url:
          type: string
          nullable: true
          format: uri
          description: Google Maps URL for the business
          example: "https://maps.google.com/?cid=123456789"
        opening_hours:
          type: object
          nullable: true
          description: Business operating hours
          properties:
            open_now:
              type: boolean
              description: Whether the business is currently open
              example: true
            weekday_text:
              type: array
              items:
                type: string
              description: Human-readable opening hours for each day
              example: [
                "Monday: 9:00 AM – 5:00 PM",
                "Tuesday: 9:00 AM – 5:00 PM",
                "Wednesday: 9:00 AM – 5:00 PM",
                "Thursday: 9:00 AM – 5:00 PM",
                "Friday: 9:00 AM – 5:00 PM",
                "Saturday: 10:00 AM – 2:00 PM",
                "Sunday: Closed"
              ]
            periods:
              type: array
              nullable: true
              description: Detailed opening periods (if available)
              items:
                type: object
                properties:
                  close:
                    type: object
                    properties:
                      day:
                        type: integer
                        minimum: 0
                        maximum: 6
                        description: Day of week (0=Sunday, 1=Monday, etc.)"
                        example: 1
                      time:
                        type: string
                        description: Closing time in HHMM format
                        example: "1700"
                  open:
                    type: object
                    properties:
                      day:
                        type: integer
                        minimum: 0
                        maximum: 6
                        description: Day of week (0=Sunday, 1=Monday, etc.)"
                        example: 1
                      time:
                        type: string
                        description: Opening time in HHMM format
                        example: "0900"

    TaskManagementResponse:
      type: object
      properties:
        task_instances:
          type: array
          items:
            $ref: '#/components/schemas/TaskInstanceWithDetails'
          description: Array of task instances with complete details
        statistics:
          $ref: '#/components/schemas/TaskManagementStatistics'
        user_id:
          type: string
          format: uuid
          description: ID of the authenticated user
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_role:
          type: string
          enum: [admin, user, executor]
          description: Role of the authenticated user
          example: "executor"
        case_id:
          type: string
          format: uuid
          description: ID of the case being queried
          example: "123e4567-e89b-12d3-a456-426614174000"
        filtered_by_user:
          type: string
          format: uuid
          nullable: true
          description: User ID used for filtering (admin only)
          example: "123e4567-e89b-12d3-a456-426614174000"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the response was generated
          example: "2024-01-15T11:00:00.000Z"

    TaskInstanceWithDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Task instance ID
          example: "task-instance-1"
        case_id:
          type: string
          format: uuid
          description: Associated case ID
          example: "case-1"
        task_template_id:
          type: string
          format: uuid
          description: Task template ID
          example: "template-1"
        assigned_user_id:
          type: string
          format: uuid
          description: ID of user assigned to this task
          example: "user-1"
        status:
          type: string
          enum: [pending, in_progress, done]
          description: Current status of the task instance
          example: "in_progress"
        created_at:
          type: string
          format: date-time
          description: When the task instance was created
          example: "2024-01-15T10:30:00.000Z"
        updated_at:
          type: string
          format: date-time
          description: When the task instance was last updated
          example: "2024-01-15T11:00:00.000Z"
        case:
          $ref: '#/components/schemas/Case'
        task_template:
          $ref: '#/components/schemas/TaskTemplate'
        assigned_user:
          $ref: '#/components/schemas/UserProfile'
        task_steps:
          type: array
          items:
            $ref: '#/components/schemas/TaskStepWithCompletion'
          description: Array of task steps with completion status
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NoteWithAuthor'
          description: Array of notes for this task instance
        articles:
          type: array
          items:
            $ref: '#/components/schemas/Article'
          description: Array of related articles

    TaskManagementStatistics:
      type: object
      properties:
        total_instances:
          type: integer
          description: Total number of task instances
          example: 5
        pending:
          type: integer
          description: Number of pending task instances
          example: 2
        in_progress:
          type: integer
          description: Number of in-progress task instances
          example: 2
        done:
          type: integer
          description: Number of completed task instances
          example: 1
        total_steps:
          type: integer
          description: Total number of task steps across all instances
          example: 15
        completed_steps:
          type: integer
          description: Number of completed task steps
          example: 8

    Case:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Case ID
          example: "case-1"
        deceased_name:
          type: string
          description: Name of the deceased person
          example: "John Doe"
        date_of_death:
          type: string
          format: date
          description: Date of death
          example: "2024-01-10"
        created_at:
          type: string
          format: date-time
          description: When the case was created
          example: "2024-01-10T08:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          description: When the case was last updated
          example: "2024-01-12T09:15:00.000Z"
        case_users:
          type: array
          description: Collaborators linked to this case
          items:
            $ref: '#/components/schemas/CaseUserAccess'

    TaskTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Task template ID
          example: "template-1"
        name:
          type: string
          description: Template name
          example: "Funeral Arrangements"
        description:
          type: string
          description: Template description
          example: "Complete funeral planning tasks"
        created_at:
          type: string
          format: date-time
          description: When the template was created
          example: "2024-01-01T00:00:00.000Z"

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
          example: "user-1"
        name:
          type: string
          description: User's full name
          example: "Jane Smith"
        email:
          type: string
          format: email
          description: User's email address
          example: "jane@example.com"
        role:
          type: string
          enum: [admin, user, executor]
          description: User's role
          example: "executor"
        created_at:
          type: string
          format: date-time
          description: When the user profile was created
          example: "2024-01-01T00:00:00.000Z"

    TaskStepWithCompletion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Task step ID
          example: "step-1"
        title:
          type: string
          description: Step title
          example: "Contact Funeral Home"
        order:
          type: integer
          description: Step order number
          example: 1
        instructions:
          type: string
          nullable: true
          description: Step instructions
          example: "Research and contact local funeral homes"
        communication_helpers:
          type: object
          nullable: true
          description: JSONB object containing communication helper data
          example:
            template_email: "Dear [Funeral Home], I am reaching out regarding funeral arrangements..."
            phone_script: "Hello, I'm calling to inquire about your funeral services..."
        completed:
          type: boolean
          description: Whether the step is completed
          example: true
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the step was completed
          example: "2024-01-15T10:45:00.000Z"

    NoteWithAuthor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Note ID
          example: "note-1"
        content:
          type: string
          description: Note content
          example: "Contacted three funeral homes, waiting for quotes"
        created_at:
          type: string
          format: date-time
          description: When the note was created
          example: "2024-01-15T10:45:00.000Z"
        author:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Author's user ID
              example: "user-1"
            name:
              type: string
              description: Author's name
              example: "Jane Smith"
            email:
              type: string
              format: email
              description: Author's email
              example: "jane@example.com"

    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Article ID
          example: "article-1"
        title:
          type: string
          description: Article title
          example: "How to Choose a Funeral Home"
        summary:
          type: string
          description: Article summary
          example: "Guidelines for selecting the right funeral home"
        content_url:
          type: string
          format: uri
          description: URL to the full article content
          example: "https://example.com/funeral-home-guide"
        read_time_min:
          type: integer
          description: Estimated reading time in minutes
          example: 5
        created_at:
          type: string
          format: date-time
          description: When the article was created
          example: "2024-01-01T00:00:00.000Z"

    ArticlesResponse:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: '#/components/schemas/Article'
          description: Array of articles
        total_count:
          type: integer
          description: Total number of articles available
          example: 25
        user_id:
          type: string
          format: uuid
          description: ID of the authenticated user
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_role:
          type: string
          enum: [admin, user, executor]
          description: Role of the authenticated user
          example: "executor"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the response was generated
          example: "2024-01-15T11:00:00.000Z"

    CasesResponse:
      type: object
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/Case'
          description: Array of cases the user can access
        total_count:
          type: integer
          description: Total number of matching cases
          example: 3
        user_id:
          type: string
          format: uuid
          description: ID of the authenticated user
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_role:
          type: string
          enum: [admin, user, executor]
          description: Role of the authenticated user
          example: "admin"
        filtered_by_user:
          type: string
          format: uuid
          nullable: true
          description: User ID used for filtering (if any)
          example: "123e4567-e89b-12d3-a456-426614174000"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the response was generated
          example: "2024-01-15T11:00:00.000Z"

    CaseUserAccess:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: ID of the user linked to the case
          example: "user-1"
        profiles:
          $ref: '#/components/schemas/UserProfile'
      description: Mapping between a case and an associated user with optional profile details.

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid category"
        message:
          type: string
          description: Additional error details
          example: "The provided category is not supported"
        details:
          type: string
          description: Technical error details (for 500 errors)
          example: "Error message details"
        available_categories:
          type: array
          items:
            type: string
          description: List of available categories (for category errors)
          example: ["banks", "funeral_homes", "legal_services"]

  examples:
    ServiceCategories:
      summary: Available service categories
      description: |
        The following categories are available for searching funeral-related services:
        
        - **banks**: Banks & Financial Services
        - **funeral_homes**: Funeral Homes & Services  
        - **legal_services**: Legal Services
        - **insurance**: Insurance Services
        - **government_services**: Government Services
        - **counseling**: Counseling & Support

tags:
  - name: Authentication
    description: |
      User authentication endpoints for signing up and signing in. These endpoints
      return JWT tokens that are required for accessing other API endpoints.
  - name: Task Management
    description: |
      Endpoints for managing funeral-related tasks and cases. These endpoints provide
      comprehensive task management functionality including task instances, steps,
      completion tracking, notes, and communication helpers.
  - name: Cases
    description: |
      Endpoints for listing and managing funeral cases and their collaborators.
  - name: Articles
    description: |
      Endpoints for accessing reference articles and documentation related to funeral
      planning and related tasks. These endpoints provide searchable access to
      educational content and guides.
  - name: Funeral Services
    description: |
      Endpoints for finding funeral-related services including banks, funeral homes,
      legal services, insurance, government services, and counseling support.
