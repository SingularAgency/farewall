name: Deploy Supabase Functions

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - staging
          - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate environment and set variables
        id: set-env
        run: |
          # Use manual input if available, otherwise use branch name
          ENV_NAME="${{ github.event.inputs.environment || github.ref_name }}"
          echo "SUPABASE_ACCESS_TOKEN=${{ secrets.SUPABASE_LOGIN_TOKEN }}" >> $GITHUB_ENV
          case "$ENV_NAME" in
            "main")
              echo "SUPABASE_PROJECT_ID=wmmqzbpkgbiweenvrhid" >> $GITHUB_ENV
              echo "ENVIRONMENT=main" >> $GITHUB_ENV
              ;;
            "staging")
              echo "SUPABASE_PROJECT_ID=jykymoqntvrmaqqfqwps" >> $GITHUB_ENV
              echo "ENVIRONMENT=staging" >> $GITHUB_ENV
              ;;
            "develop")
              echo "SUPABASE_PROJECT_ID=rxpvyojjxqvtwkwdghtf" >> $GITHUB_ENV
              echo "ENVIRONMENT=develop" >> $GITHUB_ENV
              ;;
            *)
              echo "❌ Unknown environment: $ENV_NAME"
              echo "Available environments: develop, staging, main"
              exit 1
              ;;
          esac
          
          echo "✅ Environment validated: $ENV_NAME"
          echo "Project ID: $SUPABASE_PROJECT_ID"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: |
          echo "Deploying functions to $ENVIRONMENT environment (Project ID: $SUPABASE_PROJECT_ID)"
          supabase functions deploy --project-ref $SUPABASE_PROJECT_ID

      - name: Verify deployment
        run: |
          echo "✅ Functions deployed successfully to $ENVIRONMENT environment"
          echo "Project ID: $SUPABASE_PROJECT_ID"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
